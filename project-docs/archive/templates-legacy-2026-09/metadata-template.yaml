# ============================================
# Beastkin Universe Metadata Template v3.0
# 兽盾宇宙元数据模板 v3.0
# ============================================
# Compatible with Project Structure Spec v3.0
# 适配项目结构规范 v3.0
#
# This template contains ALL possible fields with example values.
# 此模板包含所有可能的字段及示例值。
# Copy this file to your work directory, rename to metadata.yaml,
# 复制此文件到您的作品目录，重命名为metadata.yaml，
# and fill in according to your actual work information.
# 并根据您的实际作品信息填写。
#
# NOTE: Optional fields can be removed if not needed.
# 注意：可选字段如果不需要可以删除。

# ============================================
# WORK INFORMATION / 作品信息
# ============================================

work:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  # 1. Work Code - MUST match folder name exactly
  #    作品编码 - 必须与文件夹名完全一致
  code: "template-world-o-cs-001-template-identifier"

  # 2. Work Titles - Both Chinese and English required
  #    作品标题 - 中文和英文都需填写
  title:
    chinese: "模板故事中文标题"
    english: "Template Story English Title"

  # 3. Work Format - Choose one
  #    作品格式 - 选择一项
  format: "chaptered-story"  # "chaptered-story" or "short-story"

  # 4. Form Type - REQUIRED: cm/cs/s (v3.0)
  #    形式类型 - 必填: cm/cs/s
  form_type: "cs"  # "cm", "cs", or "s"
  # cm = chaptered-main (主线分章故事)
  # cs = chaptered-side (支线分章故事)
  # s  = short-story (短篇故事)

  # 5. Work Status - Choose one
  #    作品状态 - 选择一项
  status: "updating"  # "updating", "completed", or "abandoned"

  # 6. Storage Location - Choose one
  #    存储位置 - 选择一项
  location: "original-archives"  # "original-archives" or "adaptation-works"

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  # 7. Work Subtype - Automatically determined by form_type
  #    作品子类型 - 根据form_type自动确定
  subtype: "side"  # "main" or "side"
  # cm → main, cs → side, s → not needed

  # ============================================
  # OPTIONAL BUT RECOMMENDED FIELDS / 可选但推荐字段
  # ============================================

  # 8. Promotion Status
  promotion_status: "not_eligible"  # "not_eligible", "eligible", "under_review", "promoted"

  # 9. Work Type Detail
  work_type: "full-original"  # "full-original", "direct-adaptation", "adapted-expansion", "inspired-by", "crossover"

  # 10. Work Tags
  tags:
    - "template-tag-1"
    - "template-tag-2"
    - "template-tag-3"

  # 11. Content Warnings
  content_warnings:
    - "template-warning-1"
    - "template-warning-2"

  # 12. Reading Time Estimate
  reading_time_estimate:
    minutes: 60

  # 13. Target Audience
  target_audience: "general"  # "general", "mature", "all-ages"

  # 14. Series Information
  series_info:
    series_name: "Template Series Name"
    position_in_series: 1
    total_in_series: 3

  # 15. Related Works
  related_works:
    - code: "template-related-work-1"
      relation_type: "prequel"  # "prequel", "sequel", "side-story", "same-universe", "crossover"

# ============================================
# CREATION INFORMATION / 创作信息
# ============================================

creation:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  # 16. Author
  author: "Template Author Name"

  # 17. Start Date
  start_date: "2026-01-01"  # Format: YYYY-MM-DD

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  # 18. Last Update
  last_update: "2026-01-01"

  # 19. Universe
  universe_based_on: "beastshield"
  # Options: beastshield, beastshield-online, beastshield-paradise,
  #          beastshield-reforged, empire-kik-soldiers, paradise-kik-soldiers,
  #          united-beasts-alliance, worldstrider-infinity, mixed

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  # 20. Adaptation Information - REQUIRED for adaptation works
  adaptation_info:
    original_work: "bs-o-s-001-farm-inn"
    original_title: "Farm Inn Original Title"
    original_author: "Original Author Name"
    adaptation_approach: "faithful"  # "faithful", "reimagined", "loose", "theme-inversion"
    key_changes: |
      Template summary of key changes made during adaptation.
      This is a multi-line field.

  # ============================================
  # OPTIONAL ADVANCED FIELDS / 可选高级字段
  # ============================================

  # 21. Collaborators
  collaborators:
    - name: "Template Collaborator 1"
      role: "co-writer"
      contribution: "Template contribution description"

  # 22. Translator
  translator: "Template Translator Name"

  # 23. Crossover Information
  crossover_info:
    universes:
      - "beastshield"
      - "united-beasts-alliance"
    primary_universe: "beastshield"

  # 24. Creation Tools
  creation_tools:
    writing:
      - "Visual Studio Code"
    editing:
      - "Grammarly"
    other:
      - "Git for version control"

  # 25. License
  license:
    type: "CC-BY-NC-SA-4.0"
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  # 26. Publication
  publication:
    platforms:
      - "GitHub Repository"
    primary_platform: "GitHub Repository"
    urls:
      - "https://github.com/beastkin-universe"

  # 27. Revision History
  revision_history:
    - version: "1.0"
      date: "2026-01-01"
      changes: "Initial release"

# ============================================
# OPTIONAL: CHAPTER INDEX / 可选：章节索引
# ============================================
# Recommended for chaptered stories to track progress
# 分章故事推荐使用，用于追踪进度

chapters:
  - number: 1
    code: "ch-001-example"
    title_chinese: "第一章示例"
    title_english: "Chapter One Example"
    summary: "章节内容摘要"
    status: "planning"  # planning | drafting | reviewing | completed
  - number: 2
    code: "ch-002-example"
    title_chinese: "第二章示例"
    title_english: "Chapter Two Example"
    summary: "章节内容摘要"
    status: "planning"

