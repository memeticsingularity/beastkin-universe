  adaptation_info:
    original_work: "bs-o-cs-3-babysitter-lei"
    original_title: "老雷突袭情报局（原：带娃的老雷）"
    original_author: "lanse（笑天神犬）"
    adaptation_approach: "original-adaptation"
    key_changes: |
      1. 主视角企划：全篇第三人称限知于老雷，镜头全程钉在他肩上，不使用全知视角
      2. 叙事手法：慢节奏推进，极致五感细节（触觉/温度/毛发/衣料/肌肉群/嗅觉/味觉/听觉/视觉）
      3. 连续性铁律：补齐原作所有"两分钟后/几天后/下一秒"式跳切与断片，叙事从哄睡到夺盘无缝顺下来
      4. 不参考 bs-a-s-4 独立重写（楼下双牛、虎司机段落在本企划中按主视角重新成稿）
      5. 虎司机灭口末段按裁定改写：答应放人后令其**自己把车开到巷口垃圾桶旁**，在桶边就地处决、就地倒插进桶；随后老雷把车开往城南两条街外，**步行**前往情报局
      6. 小雷的在场关系对齐原作：只在棕熊那场醒一次，此后**留在浴室陪尸**（帮尸体脱军靴、"叔叔记得要勤洗脚"），Ch.2 全程在场看司机求情；淋浴冲尸移到司机放走之后
      7. 第二部《围剿》承接原作 ch-3/ch-4：**本作只写老雷亲历的部分**；原作颜部长视角的段落（清算值守兵／检尸推案／烧地）不在本作范围，留待另起独立作品

  last_update: "2026-09-16"

