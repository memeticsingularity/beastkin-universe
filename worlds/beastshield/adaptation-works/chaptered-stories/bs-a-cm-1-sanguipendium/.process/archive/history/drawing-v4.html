<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>血酬淘汰赛 - 32强对阵系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        /* 顶部规则区 */
        .rules-bar {
            background: rgba(233, 69, 96, 0.15);
            border-bottom: 2px solid #e94560;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .rule-item {
            font-size: 0.85em;
            color: #ccc;
        }

        .rule-item strong {
            color: #e94560;
        }

        /* 标题 */
        .header {
            text-align: center;
            padding: 15px;
        }

        .header h1 {
            font-size: 1.8em;
            color: #e94560;
            margin-bottom: 5px;
        }

        .header p {
            color: #888;
            font-size: 0.85em;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 0.9em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #533483, #7b2cbf);
            color: white;
        }

        /* 主对阵区 */
        .bracket-container {
            flex: 1;
            padding: 20px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .bracket-svg {
            width: 1400px;
            height: 800px;
        }

        /* 卡片样式 */
        .match-card {
            fill: rgba(255,255,255,0.08);
            stroke: rgba(255,255,255,0.2);
            stroke-width: 1;
            rx: 6;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .match-card:hover:not(.empty):not(.eliminated) {
            fill: rgba(255,255,255,0.12);
            stroke: rgba(255,255,255,0.4);
        }

        .match-card.tiger { fill: rgba(255, 152, 0, 0.15); stroke: #ff9800; }
        .match-card.bear { fill: rgba(121, 85, 72, 0.15); stroke: #8d6e63; }
        .match-card.ox { fill: rgba(96, 125, 139, 0.15); stroke: #78909c; }
        .match-card.hound { fill: rgba(63, 81, 181, 0.15); stroke: #7986cb; }

        .match-card.winner {
            stroke: #e94560;
            stroke-width: 3;
            filter: drop-shadow(0 0 8px rgba(233, 69, 96, 0.6));
        }

        .match-card.eliminated {
            fill: rgba(255,255,255,0.03);
            stroke: rgba(255,255,255,0.1);
            opacity: 0.4;
        }

        .match-card.advance {
            animation: advancePulse 0.5s ease;
        }

        @keyframes advancePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .card-text {
            fill: #fff;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
        }

        .card-info {
            fill: #888;
            font-size: 9px;
            pointer-events: none;
        }

        .card-position {
            fill: #e94560;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }

        /* 连接线 */
        .connector-line {
            fill: none;
            stroke: rgba(255,255,255,0.15);
            stroke-width: 2;
            transition: all 0.5s ease;
        }

        .connector-line.active {
            stroke: #e94560;
            stroke-width: 3;
            filter: drop-shadow(0 0 5px rgba(233, 69, 96, 0.8));
        }

        .connector-line.eliminated {
            stroke: rgba(255,255,255,0.05);
        }

        /* 轮次标签 */
        .round-label {
            fill: #e94560;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
        }

        /* 冠军 */
        .champion-card {
            fill: rgba(233, 69, 96, 0.2);
            stroke: #e94560;
            stroke-width: 2;
            rx: 10;
        }

        .champion-text {
            fill: #fff;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
        }

        .champion-sub {
            fill: #e94560;
            font-size: 11px;
            text-anchor: middle;
        }

        /* 底部选手池 */
        .pool-section {
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
        }

        .pool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .pool-title {
            font-size: 1em;
            color: #fff;
        }

        .pool-counter {
            background: #e94560;
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .pool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .pool-camp {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 10px;
        }

        .pool-camp-header {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .camp-tiger { color: #ff9800; }
        .camp-bear { color: #8d6e63; }
        .camp-ox { color: #78909c; }
        .camp-hound { color: #7986cb; }

        .pool-characters {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .pool-char {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .pool-char.drawn {
            opacity: 0.3;
            background: rgba(255,255,255,0.05);
            text-decoration: line-through;
        }

        /* 抽签动画 */
        .draw-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .draw-modal.active {
            display: flex;
        }

        .draw-card {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border: 2px solid #e94560;
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            animation: drawIn 0.4s ease;
        }

        @keyframes drawIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .draw-camp {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .draw-name {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .draw-position {
            font-size: 1.1em;
            color: #888;
        }
    </style>
</head>
<body>
<!-- 顶部规则 -->
<div class="rules-bar">
    <div class="rule-item"><strong>规避原则：</strong>每个1/8区内四族各一人</div>
    <div class="rule-item"><strong>奖金公式：</strong>500 × (9-己方存活) × (9-对方存活)</div>
    <div class="rule-item"><strong>32人：</strong><span style="color:#ff9800">虎×8</span> <span
            style="color:#8d6e63">熊×8</span> <span style="color:#78909c">牛×8</span> <span
            style="color:#7986cb">犬×8</span></div>
</div>

<!-- 标题 -->
<div class="header">
    <h1>🩸 血酬淘汰赛</h1>
    <p>第一届兽盾四营血酬淘汰赛 · 32强对阵</p>
</div>

<!-- 控制按钮 -->
<div class="controls">
    <button class="btn btn-primary" id="drawBtn" onclick="drawNext()">🎲 抽取下一位</button>
    <button class="btn btn-secondary" onclick="resetAll()">🔄 重置</button>
</div>

<!-- 对阵图 -->
<div class="bracket-container">
    <svg class="bracket-svg" id="bracketSvg" viewBox="0 0 1400 800">
        <!-- 背景 -->
        <defs>
            <pattern height="40" id="grid" patternUnits="userSpaceOnUse" width="40">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)"
                      stroke-width="1"/>
            </pattern>
        </defs>
        <rect fill="url(#grid)" height="100%" width="100%"/>

        <!-- 轮次标签 -->
        <text class="round-label" x="80" y="35">32强</text>
        <text class="round-label" x="280" y="35">16强</text>
        <text class="round-label" x="480" y="35">8强</text>
        <text class="round-label" x="680" y="35">半决赛</text>
        <text class="round-label" x="850" y="35">决赛</text>

        <!-- 左半区 -->
        <g id="left-bracket"></g>

        <!-- 冠军 -->
        <g id="champion-area">
            <rect class="champion-card" height="80" rx="10" width="140" x="780" y="360"/>
            <text class="champion-text" id="champion-name" x="850" y="395">?</text>
            <text class="champion-sub" id="champion-info" x="850" y="420">点击选择冠军</text>
        </g>

        <!-- 右半区 -->
        <g id="right-bracket"></g>
    </svg>
</div>

<!-- 底部选手池 -->
<div class="pool-section">
    <div class="pool-header">
        <div class="pool-title">🎯 选手池</div>
        <div class="pool-counter" id="counter">0/32</div>
    </div>
    <div class="pool-grid">
        <div class="pool-camp">
            <div class="pool-camp-header camp-tiger">🐯 虎之阵营</div>
            <div class="pool-characters" id="pool-tiger"></div>
        </div>
        <div class="pool-camp">
            <div class="pool-camp-header camp-bear">🐻 熊之阵营</div>
            <div class="pool-characters" id="pool-bear"></div>
        </div>
        <div class="pool-camp">
            <div class="pool-camp-header camp-ox">🐮 牛之阵营</div>
            <div class="pool-characters" id="pool-ox"></div>
        </div>
        <div class="pool-camp">
            <div class="pool-camp-header camp-hound">🐺 犬之阵营</div>
            <div class="pool-characters" id="pool-hound"></div>
        </div>
    </div>
</div>

<!-- 抽签动画 -->
<div class="draw-modal" id="drawModal">
    <div class="draw-card">
        <div class="draw-camp" id="drawCamp"></div>
        <div class="draw-name" id="drawName"></div>
        <div class="draw-position" id="drawPosition"></div>
    </div>
</div>

<script>
    // 选手数据
    const characters = {
        tiger: [
            { name: '锋牙', code: 'E-178', motive: '证明' },
            { name: '烈影', code: 'E-201', motive: '复仇' },
            { name: '岩爪', code: 'E-156', motive: '生存' },
            { name: '幼爪', code: 'E-312', motive: '救父' },
            { name: '夜瞳', code: 'E-267', motive: '野心' },
            { name: '风啸', code: 'E-289', motive: '公道' },
            { name: '金纹', code: 'E-223', motive: '荣耀' },
            { name: '残耳', code: 'E-134', motive: '神秘' }
        ],
        bear: [
            { name: '棕岩', code: 'E-145', motive: '还债' },
            { name: '黑山', code: 'E-112', motive: '赎罪' },
            { name: '白掌', code: 'E-287', motive: '还债' },
            { name: '铁背', code: 'E-198', motive: '不甘' },
            { name: '灰耳', code: 'E-267', motive: '生存' },
            { name: '厚掌', code: 'E-289', motive: '野心' },
            { name: '柔毛', code: 'E-223', motive: '证明' },
            { name: '冬眠', code: 'E-134', motive: '告别' }
        ],
        ox: [
            { name: '铁角', code: 'E-217', motive: '还债' },
            { name: '铜皮', code: 'E-189', motive: '救弟' },
            { name: '青石', code: 'E-256', motive: '赌徒' },
            { name: '泥蹄', code: 'E-198', motive: '还债' },
            { name: '砂岩', code: 'E-167', motive: '不想被卖' },
            { name: '岩裂', code: 'E-233', motive: '逃命' },
            { name: '黑土', code: 'E-245', motive: '救母' },
            { name: '荒原', code: 'E-301', motive: '杀人' }
        ],
        hound: [
            { name: '灰影', code: 'E-156', motive: '自由' },
            { name: '黑獒', code: 'E-089', motive: '家' },
            { name: '铁背(犬)', code: 'E-267', motive: '忠诚' },
            { name: '疾风', code: 'E-289', motive: '荣耀' },
            { name: '铁颚', code: 'E-223', motive: '生存' },
            { name: '雪眼', code: 'E-301', motive: '好奇' },
            { name: '铁锁', code: 'E-134', motive: '最后机会' },
            { name: '白毛', code: 'E-145', motive: '证明自己' }
        ]
    };

    const campNames = { tiger: '虎', bear: '熊', ox: '牛', hound: '犬' };
    const campColors = { tiger: '#ff9800', bear: '#8d6e63', ox: '#78909c', hound: '#7986cb' };

    // 状态
    let state = {
        currentPos: 0,
        drawn: new Set(),
        slots: {},
        winners: {},
        zoneCamps: {}
    };

    // 对阵图配置
    const cardWidth = 120;
    const cardHeight = 40;
    const gapY = 8;

    // 初始化
    function init() {
        renderPool();
        generateBracket();
    }

    // 渲染选手池
    function renderPool() {
        Object.keys(characters).forEach(camp => {
            const container = document.getElementById(`pool-${camp}`);
            container.innerHTML = characters[camp].map((char, idx) =>
                `<span class="pool-char ${camp}" id="pool-${camp}-${idx}">${char.name}</span>`
            ).join('');
        });
    }

    // 生成对阵图
    function generateBracket() {
        const leftGroup = document.getElementById('left-bracket');
        const rightGroup = document.getElementById('right-bracket');

        leftGroup.innerHTML = generateHalf('left');
        rightGroup.innerHTML = generateHalf('right');
    }

    function generateHalf(side) {
        let html = '';
        const isLeft = side === 'left';
        const baseX = isLeft ? 20 : 980;
        const direction = isLeft ? 1 : -1;

        // 32强 - 16个位置
        const r32X = baseX;
        const r32Gap = cardHeight + gapY;

        for (let i = 0; i < 16; i++) {
            const y = 60 + i * r32Gap;
            const id = `${side}-r32-${i}`;
            html += createCard(r32X, y, id, i + 1 + (isLeft ? 0 : 16));
        }

        // 16强 - 8个位置
        const r16X = baseX + direction * 200;
        const r16Gap = r32Gap * 2;

        for (let i = 0; i < 8; i++) {
            const y = 60 + cardHeight/2 + i * r16Gap;
            const id = `${side}-r16-${i}`;
            html += createCard(r16X, y, id, '');

            // 连接线：从两个32强连接到1个16强
            const fromY1 = 60 + i * 2 * r32Gap + cardHeight/2;
            const fromY2 = fromY1 + r32Gap;
            const midX = r32X + direction * 150;

            html += createConnector([
                [r32X + (isLeft ? cardWidth : 0), fromY1],
                [midX, fromY1],
                [midX, y + cardHeight/2],
                [r16X + (isLeft ? 0 : cardWidth), y + cardHeight/2]
            ], `${id}-conn`);
        }

        // 8强 - 4个位置
        const r8X = baseX + direction * 400;
        const r8Gap = r16Gap * 2;

        for (let i = 0; i < 4; i++) {
            const y = 60 + cardHeight/2 + r16Gap/2 + i * r8Gap;
            const id = `${side}-r8-${i}`;
            html += createCard(r8X, y, id, '');

            // 连接线
            const fromY1 = 60 + cardHeight/2 + i * 2 * r16Gap + cardHeight/2;
            const fromY2 = fromY1 + r16Gap;
            const midX = r16X + direction * 150;

            html += createConnector([
                [r16X + (isLeft ? cardWidth : 0), fromY1],
                [midX, fromY1],
                [midX, y + cardHeight/2],
                [r8X + (isLeft ? 0 : cardWidth), y + cardHeight/2]
            ], `${id}-conn`);
        }

        // 半决赛 - 2个位置
        const r4X = baseX + direction * 600;
        const r4Gap = r8Gap * 2;

        for (let i = 0; i < 2; i++) {
            const y = 60 + cardHeight/2 + r8Gap/2 + r16Gap/2 + i * r4Gap;
            const id = `${side}-r4-${i}`;
            html += createCard(r4X, y, id, '');

            // 连接线
            const fromY = 60 + cardHeight/2 + r16Gap/2 + i * 2 * r8Gap + r8Gap/2;
            const midX = r8X + direction * 150;

            html += createConnector([
                [r8X + (isLeft ? cardWidth : 0), fromY],
                [midX, fromY],
                [midX, y + cardHeight/2],
                [r4X + (isLeft ? 0 : cardWidth), y + cardHeight/2]
            ], `${id}-conn`);
        }

        // 决赛 - 1个位置
        const r2X = baseX + direction * 760;
        const r2Y = 280;
        const id = `${side}-r2-0`;
        html += createCard(r2X, r2Y, id, '');

        // 连接线到决赛
        const fromY1 = 60 + cardHeight/2 + r8Gap/2 + r16Gap/2 + cardHeight/2;
        const fromY2 = fromY1 + r4Gap;
        const midX = r4X + direction * 100;

        html += createConnector([
            [r4X + (isLeft ? cardWidth : 0), fromY1],
            [midX, fromY1],
            [midX, r2Y + cardHeight/2],
            [r2X + (isLeft ? 0 : cardWidth), r2Y + cardHeight/2]
        ], `${id}-conn1`);

        html += createConnector([
            [r4X + (isLeft ? cardWidth : 0), fromY2],
            [midX, fromY2],
            [midX, r2Y + cardHeight/2],
            [r2X + (isLeft ? 0 : cardWidth), r2Y + cardHeight/2]
        ], `${id}-conn2`);

        // 决赛到冠军
        const championX = 850;
        const championY = 400;
        const midFinalX = r2X + direction * 40;

        html += createConnector([
            [r2X + (isLeft ? cardWidth : 0), r2Y + cardHeight/2],
            [midFinalX, r2Y + cardHeight/2],
            [midFinalX, championY],
            [isLeft ? 780 : 920, championY]
        ], `final-${side}-conn`);

        return html;
    }

    function createCard(x, y, id, position) {
        return `
            <g onclick="selectWinner('${id}')" style="cursor: pointer;">
                <rect x="${x}" y="${y}" width="${cardWidth}" height="${cardHeight}"
                      class="match-card empty" id="${id}-rect" rx="6"/>
                <text x="${x + (position ? 8 : cardWidth/2)}" y="${y + 17}"
                      class="card-text" id="${id}-name" text-anchor="${position ? 'start' : 'middle'}">?</text>
                <text x="${x + (position ? 8 : cardWidth/2)}" y="${y + 32}"
                      class="card-info" id="${id}-info" text-anchor="${position ? 'start' : 'middle'}"></text>
                ${position ? `<text x="${x + cardWidth - 5}" y="${y + 12}" class="card-position" text-anchor="end">#${position}</text>` : ''}
            </g>
        `;
    }

    function createConnector(points, id) {
        const d = points.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p[0]} ${p[1]}`).join(' ');
        return `<path d="${d}" class="connector-line" id="${id}" />`;
    }

    // 获取位置需要的阵营
    function getRequiredCamp(position) {
        const zone = Math.floor(position / 4);
        if (!state.zoneCamps[zone]) state.zoneCamps[zone] = [];
        return Object.keys(characters).filter(c => !state.zoneCamps[zone].includes(c));
    }

    // 抽取下一个
    function drawNext() {
        if (state.currentPos >= 32) {
            alert('抽签已完成！');
            return;
        }

        const position = state.currentPos;
        const availableCamps = getRequiredCamp(position);
        const camp = availableCamps[Math.floor(Math.random() * availableCamps.length)];

        const availableChars = characters[camp].filter((_, idx) =>
            !state.drawn.has(`${camp}-${idx}`)
        );

        if (availableChars.length === 0) {
            drawNext();
            return;
        }

        const charIdx = Math.floor(Math.random() * availableChars.length);
        const char = availableChars[charIdx];
        const originalIdx = characters[camp].indexOf(char);

        // 更新状态
        const side = position < 16 ? 'left' : 'right';
        const slotId = `${side}-r32-${position % 16}`;
        state.slots[slotId] = { ...char, camp, idx: originalIdx };
        state.drawn.add(`${camp}-${originalIdx}`);
        state.zoneCamps[Math.floor(position / 4)].push(camp);
        state.currentPos++;

        showDrawAnim(char, camp, position + 1);

        setTimeout(() => {
            updateCard(slotId, char, camp);
            updatePool(camp, originalIdx);
            updateCounter();
        }, 1500);

        if (state.currentPos >= 32) {
            document.getElementById('drawBtn').disabled = true;
            document.getElementById('drawBtn').textContent = '✓ 抽签完成';
        }
    }

    function showDrawAnim(char, camp, position) {
        const modal = document.getElementById('drawModal');
        document.getElementById('drawCamp').textContent = `${campNames[camp]}之阵营`;
        document.getElementById('drawCamp').style.color = campColors[camp];
        document.getElementById('drawName').textContent = char.name;
        document.getElementById('drawName').style.color = campColors[camp];
        document.getElementById('drawPosition').textContent = `签位 #${position}`;

        modal.classList.add('active');
        setTimeout(() => modal.classList.remove('active'), 1500);
    }

    function updateCard(slotId, char, camp) {
        const rect = document.getElementById(`${slotId}-rect`);
        const name = document.getElementById(`${slotId}-name`);
        const info = document.getElementById(`${slotId}-info`);

        rect.classList.remove('empty');
        rect.classList.add(camp);
        name.textContent = char.name;
        info.textContent = `${char.code} · ${char.motive}`;
    }

    function updatePool(camp, idx) {
        const el = document.getElementById(`pool-${camp}-${idx}`);
        if (el) el.classList.add('drawn');
    }

    function updateCounter() {
        document.getElementById('counter').textContent = `${state.currentPos}/32`;
    }

    // 选择胜者
    function selectWinner(slotId) {
        if (!state.slots[slotId]) return;

        // 解析位置
        const parts = slotId.split('-');
        const side = parts[0];
        const round = parts[1];
        const idx = parseInt(parts[2]);

        // 计算下轮位置
        let nextId;
        if (round === 'r32') {
            nextId = `${side}-r16-${Math.floor(idx/2)}`;
        } else if (round === 'r16') {
            nextId = `${side}-r8-${Math.floor(idx/2)}`;
        } else if (round === 'r8') {
            nextId = `${side}-r4-${Math.floor(idx/2)}`;
        } else if (round === 'r4') {
            nextId = `${side}-r2-0`;
        } else if (round === 'r2') {
            setChampion(slotId);
            highlightLine(`final-${side}-conn`);
            return;
        }

        // 检查是否已选过
        if (state.winners[slotId]) {
            return; // 简化：不允许取消
        }

        // 标记胜者
        state.winners[slotId] = true;
        document.getElementById(`${slotId}-rect`).classList.add('winner');

        // 晋级
        advanceWinner(slotId, nextId);

        // 标记对手淘汰
        eliminateOpponent(side, round, idx);

        // 高亮连接线
        const connId = round === 'r2' ? `${slotId}-conn1` : `${nextId}-conn`;
        highlightLine(connId);
        if (round === 'r2') highlightLine(`${slotId}-conn2`);
    }

    function advanceWinner(fromId, toId) {
        const char = state.slots[fromId];
        state.slots[toId] = char;

        setTimeout(() => {
            const rect = document.getElementById(`${toId}-rect`);
            const name = document.getElementById(`${toId}-name`);
            const info = document.getElementById(`${toId}-info`);

            rect.classList.remove('empty');
            rect.classList.add(camp, 'advance');
            name.textContent = char.name;
            info.textContent = `${char.code} · ${char.motive}`;
        }, 100);
    }

    function eliminateOpponent(side, round, idx) {
        let opponentIdx;
        if (idx % 2 === 0) {
            opponentIdx = idx + 1;
        } else {
            opponentIdx = idx - 1;
        }

        const opponentId = `${side}-${round}-${opponentIdx}`;
        if (state.slots[opponentId]) {
            document.getElementById(`${opponentId}-rect`).classList.add('eliminated');
        }
    }

    function highlightLine(lineId) {
        const line = document.getElementById(lineId);
        if (line) line.classList.add('active');
    }

    function setChampion(slotId) {
        const char = state.slots[slotId];
        document.getElementById('champion-name').textContent = char.name;
        document.getElementById('champion-info').textContent = `${campNames[char.camp]}之阵营 · ${char.code}`;
        document.getElementById('champion-name').style.fill = campColors[char.camp];
    }

    // 重置
    function resetAll() {
        state = {
            currentPos: 0,
            drawn: new Set(),
            slots: {},
            winners: {},
            zoneCamps: {}
        };

        document.getElementById('drawBtn').disabled = false;
        document.getElementById('drawBtn').textContent = '🎲 抽取下一位';

        init();
    }

    // 启动
    init();
</script>
</body>
</html>
