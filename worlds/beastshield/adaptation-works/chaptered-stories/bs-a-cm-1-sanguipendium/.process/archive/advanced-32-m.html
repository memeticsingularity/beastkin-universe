<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">
    <title>血酬淘汰赛 - 32强（移动版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            padding-bottom: 80px;
        }

        /* 顶部规则栏 - 可折叠 */
        .rules-bar {
            background: rgba(233, 69, 96, 0.15);
            border-bottom: 2px solid #e94560;
            padding: 10px 15px;
            font-size: 0.8em;
        }
        .rules-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e94560;
            font-weight: bold;
        }
        .rules-content {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(233, 69, 96, 0.3);
        }
        .rules-content.active { display: block; }
        .rule-item {
            color: #ccc;
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .camp-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .camp-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .badge-tiger { background: rgba(255, 152, 0, 0.3); color: #ff9800; }
        .badge-bear { background: rgba(121, 85, 72, 0.3); color: #8d6e63; }
        .badge-ox { background: rgba(96, 125, 139, 0.3); color: #78909c; }
        .badge-hound { background: rgba(63, 81, 181, 0.3); color: #7986cb; }

        /* 头部 */
        .header {
            text-align: center;
            padding: 15px 10px 10px;
        }
        .header h1 {
            font-size: 1.5em;
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 3px;
        }
        .header p { color: #888; font-size: 0.8em; }

        /* 阶段状态 */
        .stage-status {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            padding: 10px 15px;
            margin: 0 15px 10px;
            text-align: center;
        }
        .stage-status.completed {
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
        }
        .stage-status-text { font-size: 0.9em; color: #e94560; font-weight: bold; }
        .stage-status.completed .stage-status-text { color: #4caf50; }
        .stage-progress { font-size: 0.75em; color: #888; margin-top: 4px; }

        /* 奖金统计 */
        .money-stats {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            padding: 10px 15px;
            margin: 0 15px 10px;
        }
        .money-stats-title { font-size: 0.8em; color: #ffd700; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .camp-money-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .camp-money-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            font-size: 0.8em;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .camp-money-value { color: #ffd700; font-weight: bold; }
        .alive-count { font-size: 0.7em; color: #888; }
        .current-multiplier {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 4px;
            padding: 6px;
            margin-top: 8px;
            text-align: center;
        }
        .current-multiplier-text { font-size: 0.7em; color: #4caf50; }
        .current-multiplier-value { font-size: 0.9em; color: #ffd700; font-weight: bold; }

        /* 可折叠的选手池 */
        .pool-section {
            margin: 0 15px 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .pool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .pool-title { font-size: 0.95em; color: #fff; font-weight: bold; }
        .pool-counter {
            background: #e94560;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.8em;
        }
        .pool-toggle-icon { font-size: 0.8em; color: #888; transition: transform 0.3s; }
        .pool-section.active .pool-toggle-icon { transform: rotate(180deg); }
        .pool-content {
            display: none;
            padding: 10px;
        }
        .pool-section.active .pool-content { display: block; }
        .pool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .pool-camp-box {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px;
        }
        .pool-camp-header {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .pool-characters {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .pool-char {
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            background: rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }
        .pool-char.drawn {
            opacity: 0.3;
            background: rgba(255,255,255,0.05);
            text-decoration: line-through;
            cursor: not-allowed;
        }
        .char-code { font-size: 0.7em; opacity: 0.7; }
        .click-hint {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 4px;
            padding: 6px;
            margin-top: 8px;
            font-size: 0.75em;
            color: #4caf50;
            text-align: center;
        }

        /* 对阵表容器 */
        .bracket-container {
            padding: 10px 15px;
        }
        .round-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .round-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: #888;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .round-tab.active {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
            color: #fff;
        }
        .round-content { display: none; }
        .round-content.active { display: block; }

        /* 对阵卡片 */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-card-mobile {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 12px;
            position: relative;
        }
        .match-position {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.75em;
            color: #e94560;
            font-weight: bold;
        }
        .match-players {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border-left: 3px solid transparent;
        }
        .player-row.tiger { border-left-color: #ff9800; background: rgba(255, 152, 0, 0.1); }
        .player-row.bear { border-left-color: #8d6e63; background: rgba(121, 85, 72, 0.1); }
        .player-row.ox { border-left-color: #78909c; background: rgba(96, 125, 139, 0.1); }
        .player-row.hound { border-left-color: #7986cb; background: rgba(63, 81, 181, 0.1); }
        .player-row.empty {
            background: rgba(255,255,255,0.03);
            border-left-color: transparent;
            color: #666;
            font-style: italic;
        }
        .player-row.winner {
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
            border: 1px solid rgba(233, 69, 96, 0.5);
        }
        .player-row.eliminated { opacity: 0.4; filter: grayscale(0.8); }
        .player-row.locked { opacity: 0.5; }
        .player-info { flex: 1; }
        .player-name { font-size: 0.95em; font-weight: 600; }
        .player-camp { font-size: 0.75em; color: #888; margin-top: 2px; }
        .player-money { font-size: 0.85em; color: #ffd700; font-weight: bold; }
        .vs-divider {
            text-align: center;
            color: #e94560;
            font-weight: bold;
            font-size: 0.8em;
            position: relative;
        }
        .vs-divider::before,
        .vs-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 1px;
            background: rgba(233, 69, 96, 0.3);
        }
        .vs-divider::before { left: 20%; }
        .vs-divider::after { right: 20%; }
        .winner-badge {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
        }

        /* 冠军区域 */
        .champion-section {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(201, 55, 84, 0.3));
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        .champion-title { color: #e94560; font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .champion-card {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .champion-card.empty { color: #666; font-style: italic; }
        .champion-name { font-size: 1.3em; font-weight: bold; color: #fff; }
        .champion-camp { font-size: 0.9em; color: #e94560; margin-top: 5px; }
        .champion-money { font-size: 1em; color: #ffd700; margin-top: 8px; font-weight: bold; }

        /* 底部固定操作栏 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 13, 26, 0.95);
            border-top: 1px solid rgba(233, 69, 96, 0.3);
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 0.95em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #533483, #7b2cbf);
            color: white;
        }
        .btn-accent {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }
        .btn:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

        /* 抽签弹窗 */
        .draw-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .draw-modal.active { display: flex; }
        .draw-card {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border: 2px solid #e94560;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            animation: drawIn 0.4s ease;
        }
        @keyframes drawIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .draw-camp { font-size: 1em; margin-bottom: 10px; }
        .draw-name { font-size: 1.8em; color: #e94560; font-weight: bold; margin-bottom: 10px; }
        .draw-position { font-size: 1em; color: #888; }

        /* 命运弹窗 */
        .fate-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 2000;
            background: rgba(0,0,0,0.9);
        }
        .fate-modal.active { display: block; }
        .fate-content {
            height: 100%;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .fate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }
        .fate-title { font-size: 1.1em; font-weight: bold; color: #e94560; }
        .fate-close {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.5);
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
        }
        .fate-char-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .fate-camp { padding: 4px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .fate-camp.tiger { background: rgba(255, 152, 0, 0.3); color: #ff9800; }
        .fate-camp.bear { background: rgba(121, 85, 72, 0.3); color: #8d6e63; }
        .fate-camp.ox { background: rgba(96, 125, 139, 0.3); color: #78909c; }
        .fate-camp.hound { background: rgba(63, 81, 181, 0.3); color: #7986cb; }
        .fate-name { font-size: 1.2em; font-weight: bold; color: #fff; }
        .fate-section {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .fate-section-title {
            font-size: 0.95em;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }
        .fate-text {
            font-size: 0.9em;
            line-height: 1.7;
            color: #ccc;
            text-align: justify;
        }
        .fate-timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .fate-timeline-item {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            border-left: 3px solid rgba(255,255,255,0.2);
        }
        .fate-timeline-item.current {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }
        .fate-timeline-item.reached {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }
        .fate-timeline-item.eliminated {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }
        .fate-timeline-stage { font-size: 0.8em; font-weight: bold; color: #e94560; margin-bottom: 4px; }
        .fate-timeline-text { font-size: 0.85em; color: #ccc; }

        /* 提示信息 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 1px solid #e94560;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 0.9em;
            z-index: 3000;
            display: none;
        }
        .toast.active { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
    </style>
</head>
<body>
<!-- 规则栏 -->
<div class="rules-bar">
    <div class="rules-toggle" onclick="toggleRules()">
        <span>📋 比赛规则（点击查看）</span>
        <span id="rulesIcon">▼</span>
    </div>
    <div class="rules-content" id="rulesContent">
        <div class="rule-item"><strong>死亡即淘汰：</strong>战败者死亡，赏金归胜者</div>
        <div class="rule-item"><strong>赏金累计：</strong>每轮奖金系数 × 双方阵营存活人数</div>
        <div class="rule-item"><strong>强制击杀：</strong>必须决出生死，不可投降</div>
        <div class="camp-badges">
            <span class="camp-badge badge-tiger">虎×8</span>
            <span class="camp-badge badge-bear">熊×8</span>
            <span class="camp-badge badge-ox">牛×8</span>
            <span class="camp-badge badge-hound">犬×8</span>
        </div>
    </div>
</div>

<!-- 头部 -->
<div class="header">
    <h1>血酬淘汰赛</h1>
    <p>32强对阵 · 移动版</p>
</div>

<!-- 阶段状态 -->
<div class="stage-status" id="stageStatus">
    <div class="stage-status-text">阶段：32强抽签中</div>
    <div class="stage-progress">需填满32个位置</div>
</div>

<!-- 奖金统计 -->
<div class="money-stats">
    <div class="money-stats-title">💰 阵营奖金统计</div>
    <div class="camp-money-list" id="campMoneyStats"></div>
    <div class="current-multiplier">
        <div class="current-multiplier-text">当前奖金系数</div>
        <div class="current-multiplier-value" id="multiplierValue">500 × 8 × 8 = 32000</div>
    </div>
</div>

<!-- 选手池 -->
<div class="pool-section active" id="poolSection">
    <div class="pool-header" onclick="togglePool()">
        <div>
            <span class="pool-title">选手池</span>
            <span class="pool-counter" id="counter">0/32</span>
        </div>
        <span class="pool-toggle-icon" id="poolToggleIcon">▼</span>
    </div>
    <div class="pool-content">
        <div class="pool-grid">
            <div class="pool-camp-box">
                <div class="pool-camp-header badge-tiger">虎之阵营</div>
                <div class="pool-characters" id="pool-tiger"></div>
            </div>
            <div class="pool-camp-box">
                <div class="pool-camp-header badge-bear">熊之阵营</div>
                <div class="pool-characters" id="pool-bear"></div>
            </div>
            <div class="pool-camp-box">
                <div class="pool-camp-header badge-ox">牛之阵营</div>
                <div class="pool-characters" id="pool-ox"></div>
            </div>
            <div class="pool-camp-box">
                <div class="pool-camp-header badge-hound">犬之阵营</div>
                <div class="pool-characters" id="pool-hound"></div>
            </div>
        </div>
        <div class="click-hint" id="clickHint">💡 点击选手落位到固定签位</div>
    </div>
</div>

<!-- 对阵表 -->
<div class="bracket-container">
    <div class="round-tabs">
        <div class="round-tab active" onclick="switchRound('r32')">32强</div>
        <div class="round-tab" onclick="switchRound('r16')">16强</div>
        <div class="round-tab" onclick="switchRound('r8')">8强</div>
        <div class="round-tab" onclick="switchRound('r4')">4强</div>
        <div class="round-tab" onclick="switchRound('r2')">决赛</div>
    </div>

    <div class="round-content active" id="r32">
        <div class="match-list" id="r32-list"></div>
    </div>
    <div class="round-content" id="r16">
        <div class="match-list" id="r16-list"></div>
    </div>
    <div class="round-content" id="r8">
        <div class="match-list" id="r8-list"></div>
    </div>
    <div class="round-content" id="r4">
        <div class="match-list" id="r4-list"></div>
    </div>
    <div class="round-content" id="r2">
        <div class="match-list" id="r2-list"></div>
        <div class="champion-section">
            <div class="champion-title">🏆 冠军</div>
            <div class="champion-card" id="champion-card">
                <div style="color: #666; font-style: italic;">待决赛完成</div>
            </div>
        </div>
    </div>
</div>

<!-- 底部操作栏 -->
<div class="bottom-bar">
    <button class="btn btn-primary" id="drawBtn" onclick="drawNext()">下一位</button>
    <button class="btn btn-accent" id="autoDrawBtn" onclick="autoDrawAll()">一键</button>
    <button class="btn btn-secondary" onclick="resetAll()">重置</button>
</div>

<!-- 抽签弹窗 -->
<div class="draw-modal" id="drawModal">
    <div class="draw-card">
        <div class="draw-camp" id="drawCamp"></div>
        <div class="draw-name" id="drawName"></div>
        <div class="draw-position" id="drawPosition"></div>
    </div>

            '犬高忠': { entry: '犬高忠靠在院墙边，身形修长而精瘦。三十岁，E-157。曾经是野狼，渴望自由。', r32win: '胜利。老骨头还能用。', r32loss: '死亡。他还是没能获得自由，还是被困在笼子里。', r16win: '胜利。他要继续战斗，继续追求自由。', r16loss: '死亡。他还是没能获得自由。', r8win: '四强。他证明了自由，证明了不屈。', r8loss: '死亡。他的自由之路走到了尽头。', semiWin: '胜利。他终于有机会获得自由。', semiLoss: '死亡。', finalWin: '冠军！赢得了自由，赢得了回归草原的权利。', finalLoss: '亚军。他已经证明了自己是野狼。' }

    };

    // 对阵结构 - 与PC端一致
    const bracketStructure = {
        'r32': Array.from({length: 32}, (_, i) => ({
            id: `R32-${i}`,
            position: i + 1,
            next: `R16-${Math.floor(i/2)}`,
            round: 32
        })),
        'r16': Array.from({length: 16}, (_, i) => ({
            id: `R16-${i}`,
            position: i + 1,
            next: `R8-${Math.floor(i/2)}`,
            round: 16
        })),
        'r8': Array.from({length: 8}, (_, i) => ({
            id: `R8-${i}`,
            position: i + 1,
            next: `R4-${Math.floor(i/2)}`,
            round: 8
        })),
        'r4': Array.from({length: 4}, (_, i) => ({
            id: `R4-${i}`,
            position: i + 1,
            next: `R2-${Math.floor(i/2)}`,
            round: 4
        })),
        'r2': Array.from({length: 2}, (_, i) => ({
            id: `R2-${i}`,
            position: i + 1,
            next: 'champion',
            round: 2
        }))
    };

    // 状态管理
    let state = {
        filledPositions: new Set(),
        slots: {},
        winners: {},
        stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
        stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 },
        campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
        playerMoney: {},
        campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 }
    };

    let currentSignIndex = 0;
    let currentRound = 'r32';

    function init() {
        renderPool();
        renderAllRounds();
        updateStats();
    }

    function renderPool() {
        Object.keys(characters).forEach(camp => {
            const container = document.getElementById(`pool-${camp}`);
            container.innerHTML = '';
            characters[camp].forEach(char => {
                const el = document.createElement('div');
                const isDrawn = state.filledPositions.has(getPositionByName(char.name));
                el.className = `pool-char ${isDrawn ? 'drawn' : ''}`;
                el.innerHTML = `<span>${char.name}</span><span class="char-code">${char.code}</span>`;
                el.onclick = () => clickPoolChar(char.name, camp);
                container.appendChild(el);
            });
        });
    }

    function getPositionByName(name) {
        const sign = fixedSignOrder.find(s => s.name === name);
        return sign ? sign.position : null;
    }

    function clickPoolChar(name, camp) {
        if (state.filledPositions.size >= 32) return;

        const signInfo = fixedSignOrder.find(s => s.name === name);
        if (!signInfo) return;

        if (state.filledPositions.has(signInfo.position)) return;

        showDrawAnimation(signInfo);
        setTimeout(() => {
            placeCharacter(signInfo);
        }, 600);
    }

    function showDrawAnimation(signInfo) {
        const modal = document.getElementById('drawModal');
        document.getElementById('drawCamp').innerHTML = `<span class="camp-badge badge-${signInfo.camp}">${campNames[signInfo.camp]}之阵营</span>`;
        document.getElementById('drawName').textContent = signInfo.name;
        document.getElementById('drawPosition').textContent = `签位 ${signInfo.position}`;
        modal.classList.add('active');
        setTimeout(() => modal.classList.remove('active'), 1000);
    }

    function placeCharacter(signInfo) {
        const { name, camp, position } = signInfo;

        if (state.filledPositions.has(position)) return;

        const charEl = document.querySelector(`#pool-${camp} .pool-char:not(.drawn)`);
        if (charEl) {
            const chars = characters[camp];
            const idx = chars.findIndex(c => c.name === name);
            const char = chars[idx];
            state.slots[`R32-${position-1}`] = { ...char, camp, idx, position, slotId: `R32-${position-1}` };
        }

        state.filledPositions.add(position);
        currentSignIndex++;
        updateStats();
        renderAllRounds();

        if (state.filledPositions.size >= 32) {
            document.getElementById('drawBtn').disabled = true;
            document.getElementById('autoDrawBtn').disabled = true;
            document.getElementById('stageStatus').classList.add('completed');
        }
    }

    function renderAllRounds() {
        renderRound('r32');
        renderRound('r16');
        renderRound('r8');
        renderRound('r4');
        renderRound('r2');
        updateChampion();
    }

    function renderRound(roundName) {
        const container = document.getElementById(`${roundName}-list`);
        container.innerHTML = '';

        const rounds = bracketStructure[roundName];
        for (let i = 0; i < rounds.length; i += 2) {
            const slot1 = rounds[i];
            const slot2 = rounds[i + 1];
            const card = createMatchCard(slot1, slot2, roundName);
            container.appendChild(card);
        }
    }

    function createMatchCard(slot1, slot2, roundName) {
        const round = parseInt(roundName.substring(1));
        const char1 = state.slots[slot1.id];
        const char2 = state.slots[slot2.id];

        const card = document.createElement('div');
        card.className = 'match-card-mobile';

        const matchId = `${roundName}-${slot1.position}`;
        const nextSlot = slot1.next;

        let p1Row, p2Row;

        if (char1) {
            p1Row = createPlayerRow(char1, slot1.id, round);
        } else {
            p1Row = createEmptyRow(round);
        }

        if (char2) {
            p2Row = createPlayerRow(char2, slot2.id, round);
        } else {
            p2Row = createEmptyRow(round);
        }

        card.innerHTML = `
            <div class="match-position">${slot1.position}-${slot2.position}</div>
            <div class="match-players">
                ${p1Row}
                <div class="vs-divider">VS</div>
                ${p2Row}
            </div>
        `;

        return card;
    }

    function createPlayerRow(char, slotId, round) {
        const isWinner = state.winners[slotId];
        const isEliminated = isOpponentWinner(slotId);
        const canClick = canSelectWinner(round) && !isWinner && !isEliminated && char;

        return `
            <div class="player-row ${char.camp} ${isWinner ? 'winner' : ''} ${isEliminated ? 'eliminated' : ''} ${!canClick ? 'locked' : ''}"
                 onclick="handlePlayerClick('${slotId}', ${round})">
                <div class="player-info">
                    <div class="player-name">${char.name}</div>
                    <div class="player-camp">${campNames[char.camp]}营 · ${char.code}</div>
                </div>
                ${isWinner ? '<span class="winner-badge">胜</span>' : ''}
            </div>
        `;
    }

    function createEmptyRow(round) {
        return `<div class="player-row empty">待抽签</div>`;
    }

    function isOpponentWinner(slotId) {
        const slot = findSlot(slotId);
        if (!slot) return false;
        const opponentId = findOpponentId(slotId);
        return opponentId && state.winners[opponentId];
    }

    function findSlot(slotId) {
        for (const round of Object.values(bracketStructure)) {
            const slot = round.find(s => s.id === slotId);
            if (slot) return slot;
        }
        return null;
    }

    function findOpponentId(slotId) {
        for (const round of Object.values(bracketStructure)) {
            const idx = round.findIndex(s => s.id === slotId);
            if (idx >= 0) {
                if (idx % 2 === 0 && idx + 1 < round.length) return round[idx + 1].id;
                if (idx % 2 === 1) return round[idx - 1].id;
            }
        }
        return null;
    }

    function canSelectWinner(round) {
        if (round === 32) return state.filledPositions.size >= 32;
        if (round === 16) return state.stageCompleted[32];
        if (round === 8) return state.stageCompleted[16];
        if (round === 4) return state.stageCompleted[8];
        if (round === 2) return state.stageCompleted[4];
        return false;
    }

    function handlePlayerClick(slotId, round) {
        if (!canSelectWinner(round)) {
            if (state.slots[slotId]) showFateModal(slotId);
            return;
        }

        if (state.winners[slotId]) {
            showFateModal(slotId);
            return;
        }

        const opponentId = findOpponentId(slotId);
        if (opponentId && state.winners[opponentId]) {
            showFateModal(slotId);
            return;
        }

        selectWinner(slotId);
    }

    function selectWinner(slotId) {
        const char = state.slots[slotId];
        if (!char) return;

        const slot = findSlot(slotId);
        if (!slot || !slot.next) return;

        const opponentId = findOpponentId(slotId);
        const opponent = opponentId ? state.slots[opponentId] : null;

        const bonus = calculateBonus(char.camp, opponent ? opponent.camp : char.camp);
        const playerId = `${char.camp}-${char.idx}`;

        if (!state.playerMoney[playerId]) state.playerMoney[playerId] = 0;
        state.playerMoney[playerId] += bonus.amount;
        state.campMoney[char.camp] += bonus.amount;

        if (opponentId && state.slots[opponentId]) {
            state.campAlive[opponent.camp]--;
        }

        state.winners[slotId] = true;
        state.stageWinners[slot.round]++;

        const requiredWinners = slot.round === 32 ? 16 : slot.round === 16 ? 8 : slot.round === 8 ? 4 : slot.round === 4 ? 2 : 1;
        if (state.stageWinners[slot.round] >= requiredWinners) {
            state.stageCompleted[slot.round] = true;
            updateStageStatus();
        }

        if (slot.next === 'champion') {
            setChampion(slotId);
        } else {
            advanceWinner(slotId, slot.next);
        }

        updateStats();
        renderAllRounds();
    }

    function calculateBonus(winnerCamp, loserCamp) {
        const ownAlive = state.campAlive[winnerCamp];
        const ownFactor = 9 - ownAlive;
        const otherAlive = state.campAlive[loserCamp];
        const otherFactor = 9 - otherAlive;
        return {
            amount: 500 * ownFactor * otherFactor,
            ownFactor,
            otherFactor
        };
    }

    function advanceWinner(fromId, toId) {
        const char = state.slots[fromId];
        state.slots[toId] = { ...char, slotId: toId };
    }

    function setChampion(slotId) {
        const char = state.slots[slotId];
        state.slots['champion'] = { ...char, position: '冠军' };
        state.winners['champion'] = true;
        state.stageCompleted[2] = true;
    }

    function updateChampion() {
        const card = document.getElementById('champion-card');
        if (state.slots['champion']) {
            const char = state.slots['champion'];
            const playerId = `${char.camp}-${char.idx}`;
            const totalMoney = state.playerMoney[playerId] || 0;
            card.innerHTML = `
                <div class="champion-name">${char.name}</div>
                <div class="champion-camp">${campNames[char.camp]}之阵营 · ${char.code}</div>
                <div class="champion-money">累计 💰 ${totalMoney.toLocaleString()}</div>
            `;
            card.className = 'champion-card';
            card.onclick = () => showFateModal('champion');
        } else {
            card.innerHTML = '<div style="color: #666; font-style: italic;">待决赛完成</div>';
            card.className = 'champion-card empty';
        }
    }

    function updateStageStatus() {
        const statusEl = document.querySelector('.stage-status-text');
        const progressEl = document.querySelector('.stage-progress');

        if (!state.stageCompleted[32]) {
            statusEl.textContent = '阶段：32强抽签完成';
            progressEl.textContent = '当前阶段：32进16 - 点击选手选择胜者';
        } else if (!state.stageCompleted[16]) {
            statusEl.textContent = '阶段：32进16完成';
            progressEl.textContent = '当前阶段：16进8';
        } else if (!state.stageCompleted[8]) {
            statusEl.textContent = '阶段：16进8完成';
            progressEl.textContent = '当前阶段：8进4';
        } else if (!state.stageCompleted[4]) {
            statusEl.textContent = '阶段：8进4完成';
            progressEl.textContent = '当前阶段：半决赛';
        } else if (!state.stageCompleted[2]) {
            statusEl.textContent = '阶段：半决赛完成';
            progressEl.textContent = '当前阶段：决赛';
        } else {
            statusEl.textContent = '阶段：决赛完成';
            progressEl.textContent = '冠军已产生';
        }
    }

    function updateStats() {
        document.getElementById('counter').textContent = `${state.filledPositions.size}/32`;

        const campMoneyStats = document.getElementById('campMoneyStats');
        campMoneyStats.innerHTML = Object.keys(campNames).map(camp => `
            <div class="camp-money-item">
                <span>
                    <span class="camp-badge badge-${camp}">${campNames[camp]}</span>
                    <span class="alive-count">${state.campAlive[camp]}/8</span>
                </span>
                <span class="camp-money-value">${state.campMoney[camp].toLocaleString()}</span>
            </div>
        `).join('');

        const minAlive = Math.min(...Object.values(state.campAlive));
        const maxAlive = Math.max(...Object.values(state.campAlive));
        const multiplier = 500 * (9 - minAlive) * (9 - maxAlive);
        document.getElementById('multiplierValue').textContent =
            `500 × ${9 - minAlive} × ${9 - maxAlive} = ${multiplier.toLocaleString()}`;

        if (state.filledPositions.size >= 32) {
            updateStageStatus();
        }
    }

    function showFateModal(slotId) {
        const char = state.slots[slotId];
        if (!char) return;

        const modal = document.getElementById('fateModal');
        const body = document.getElementById('fateBody');

        const slot = findSlot(slotId);
        const isChampion = slotId === 'champion';

        // 确定当前进度
        let currentProgress = 0;
        let finalResult = '';

        if (slot) {
            const round = slot.round;
            const isWinner = state.winners[slotId];
            const opponentId = findOpponentId(slotId);
            const isEliminated = opponentId && state.winners[opponentId];

            if (round === 32) {
                if (isWinner) currentProgress = 1;
                else if (isEliminated) { currentProgress = 1; finalResult = '止步32强'; }
            } else if (round === 16) {
                if (isWinner) currentProgress = 3;
                else if (isEliminated) { currentProgress = 3; finalResult = '止步16强'; }
                else currentProgress = 2;
            } else if (round === 8) {
                if (isWinner) currentProgress = 5;
                else if (isEliminated) { currentProgress = 5; finalResult = '止步8强'; }
                else currentProgress = 4;
            } else if (round === 4) {
                if (isWinner) currentProgress = 7;
                else if (isEliminated) { currentProgress = 7; finalResult = '止步4强'; }
                else currentProgress = 6;
            } else if (round === 2) {
                if (isChampion) { currentProgress = 9; finalResult = '👑 冠军'; }
                else if (state.winners['champion']) { currentProgress = 9; finalResult = '🥈 亚军'; }
                else if (isEliminated) { currentProgress = 7; finalResult = '🥈 亚军'; }
                else currentProgress = 8;
            }
        } else if (isChampion) {
            currentProgress = 9;
            finalResult = '👑 冠军';
        }

        // 获取命运数据
        const fateData = fateCommentary[char.camp] && fateCommentary[char.camp][char.name];

        // 确定每个阶段的状态和文本
        const stages = [
            { key: 'entry', name: '32强入场', progress: 0 },
            { key: 'r32win', lossKey: 'r32loss', name: '32进16', progress: 1 },
            { key: 'r16entry', name: '16强入场', progress: 2 },
            { key: 'r16win', lossKey: 'r16loss', name: '16进8', progress: 3 },
            { key: 'r8entry', name: '8强入场', progress: 4 },
            { key: 'r8win', lossKey: 'r8loss', name: '8进4', progress: 5 },
            { key: 'r4entry', name: '4强入场', progress: 6 },
            { key: 'semiWin', lossKey: 'semiLoss', name: '半决赛', progress: 7 },
            { key: 'finalEntry', name: '决赛入场', progress: 8 },
            { key: 'finalWin', lossKey: 'finalLoss', name: '决赛', progress: 9 }
        ];

        let timelineHTML = '';
        // 如果已被淘汰或决出冠军，只显示到当前阶段（不显示"尚未开始"）
        const maxStageIndex = finalResult
            ? stages.findIndex(s => s.progress === currentProgress)
            : stages.length - 1;

        stages.forEach((stage, index) => {
            // 如果已被淘汰，跳过后续所有"尚未开始"的阶段
            if (finalResult && index > maxStageIndex) return;

            let itemClass = 'fate-timeline-item';
            let stageText = '';
            let isEliminatedAtThisStage = false;
            let stageLabel = stage.name;

            // 判断是否在当前阶段被淘汰
            if (finalResult && stage.progress === currentProgress && stage.lossKey) {
                isEliminatedAtThisStage = true;
            }

            if (stage.progress < currentProgress) {
                itemClass += ' reached';
                stageLabel += ' ✓ 通过';
                // 已通过的显示入场文本
                if (fateData && stage.key) {
                    stageText = fateData[stage.key] || '';
                }
            } else if (isEliminatedAtThisStage) {
                itemClass += ' eliminated';
                stageLabel += ' ✗ 死亡';
                // 被淘汰的显示失败文本
                if (fateData && stage.lossKey) {
                    stageText = fateData[stage.lossKey] || '';
                }
            } else if (stage.progress === currentProgress && !finalResult) {
                itemClass += ' current';
                stageLabel += ' ● 当前';
                // 当前阶段显示入场文本
                if (fateData && stage.key) {
                    stageText = fateData[stage.key] || '';
                }
            } else {
                // 未到达的阶段
                itemClass += ' future';
                stageText = '○ 尚未开始';
            }

            // 限制文本长度
            if (stageText.length > 100) {
                stageText = stageText.substring(0, 100) + '...';
            }

            timelineHTML += `
                <div class="${itemClass}">
                    <div class="fate-timeline-stage">${stageLabel}</div>
                    <div class="fate-timeline-text">${stageText}</div>
                </div>
            `;
        });

        body.innerHTML = `
            <div class="fate-char-info">
                <span class="fate-camp ${char.camp}">${campNames[char.camp]}之阵营</span>
                <span class="fate-name">${char.name}</span>
            </div>
            <div class="fate-section">
                <div class="fate-section-title">📖 人物小传</div>
                <div class="fate-text">${fateData ? fateData.entry : char.story}</div>
                <div style="margin-top: 10px; font-size: 0.85em; color: #888;">
                    <strong>动机：</strong>${char.motive} | <strong>年龄：</strong>${char.age}岁 | <strong>编号：</strong>${char.code}
                </div>
            </div>
            <div class="fate-section">
                <div class="fate-section-title">📜 命运历程</div>
                <div class="fate-timeline">${timelineHTML}</div>
            </div>
            ${finalResult ? `<div class="fate-section" style="text-align: center; color: #e94560; font-weight: bold; font-size: 1.1em;">${finalResult}</div>` : ''}
        `;

        modal.classList.add('active');
    }

    function closeFateModal() {
        document.getElementById('fateModal').classList.remove('active');
    }

    function toggleRules() {
        const content = document.getElementById('rulesContent');
        const icon = document.getElementById('rulesIcon');
        content.classList.toggle('active');
        icon.textContent = content.classList.contains('active') ? '▲' : '▼';
    }

    function togglePool() {
        const section = document.getElementById('poolSection');
        section.classList.toggle('active');
    }

    function switchRound(round) {
        currentRound = round;
        document.querySelectorAll('.round-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.round-content').forEach(content => content.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(round).classList.add('active');
    }

    function drawNext() {
        if (state.filledPositions.size >= 32) {
            showToast('抽签已完成！');
            return;
        }

        const remaining = fixedSignOrder.filter(s => !state.filledPositions.has(s.position));
        if (remaining.length === 0) return;

        const signInfo = remaining[0];
        showDrawAnimation(signInfo);
        setTimeout(() => {
            placeCharacter(signInfo);
        }, 600);
    }

    function autoDrawAll() {
        if (state.filledPositions.size >= 32) {
            showToast('抽签已完成！');
            return;
        }

        const remaining = fixedSignOrder.filter(s => !state.filledPositions.has(s.position));
        remaining.forEach((signInfo, index) => {
            setTimeout(() => {
                placeCharacter(signInfo);
            }, index * 100);
        });

        showToast('一键抽签完成！');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 2000);
    }

    function resetAll() {
        if (!confirm('确定要重置整个淘汰赛吗？所有数据将清空。')) return;

        state = {
            filledPositions: new Set(),
            slots: {},
            winners: {},
            stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
            stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 },
            campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
            playerMoney: {},
            campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 }
        };
        currentSignIndex = 0;

        document.getElementById('drawBtn').disabled = false;
        document.getElementById('autoDrawBtn').disabled = false;
        document.getElementById('stageStatus').classList.remove('completed');

        init();
        showToast('已重置');
    }

    init();
</script>
</body>
</html>
