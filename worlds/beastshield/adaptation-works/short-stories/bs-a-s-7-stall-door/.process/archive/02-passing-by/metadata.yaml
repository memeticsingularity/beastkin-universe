    - name: 猪兽人摊主
      species: 猪兽人
      role: 早饭摊摊主
      description: 知道这只虎兽人吃什么、搁不搁葱，从来没问过。全篇没说一句台词。最后收了钱，端一碗面过去，放下就走开。

