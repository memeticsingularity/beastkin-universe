writing_rules:
  - 全篇第三人称限知，不越出主角的感官
  - **主角全篇零台词**——他想说的两句在嘴里过了一遍，都没出口
  - 不解释。不写「这说明」「他这才意识到」「心里一酸」
  - 不给任何人名字
  - 不出现「她」「母亲」「说」（对话一律用直接引语，不加标签）
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 黑制服配**黑袜**，不是白袜（原作 Ch.5 ：「就连紧贴小腿的长筒袜也是黑袜」）
  - 结尾不许有形容词

notes:
  - 本篇与第 1 篇《隔间》共用同一个起点场景，但**核心机关相反**：
    第 1 篇的小孩看见门缝下的靴尖，知道里面是兽盾的人（恨冲着衣服来）；
    第 2 篇的小孩什么都不知道，他骂的是一扇门。
  - 结尾刻意不写"主角意识到什么"。他走了，小孩没伸手，就这样。
