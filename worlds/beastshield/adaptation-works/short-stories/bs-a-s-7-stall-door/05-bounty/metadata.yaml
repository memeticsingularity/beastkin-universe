origin:
  kind: 作者提供走向
  summary: |
    作者走向：这一次门外还是小孩。门里的人推开门的时候，小孩大叫「这不是兽盾的杂碎吗？爸爸快来！有撸币赚了！」，
    然后特工／赏金猎人走过来，美美地拿下了。
  adaptation_note: |
    作者交代「这只是大概的情节走向，具体的台词设计可以更优化」，故本篇对白按 ①③ 与合集笔风重做，几处设计：
    1. **小孩的腔调反转**作为全文机关：门外踹门骂街是**活儿**，不是脾气。门一开，那副骂街的嗓子「一下就收了」，
       换成「亮、脆，练过很多遍的那种」——这一句是全篇的反转点。
    2. **猎人的职业感**：动手前「先把碗往桌子正中推了推」。
    3. **三句冷台词**：值钱的我都认识／求我没用，价钱是公司定的／绿的，是绿的价。
    4. **围观者不干预**化成台词：「喊吧。这条街上，没人管兽盾的事。」
    5. 门里那位的死因定为**他开了门**（沉默是活路，他偏偏开了）——与 01（不出声而活）形成正反对照。

