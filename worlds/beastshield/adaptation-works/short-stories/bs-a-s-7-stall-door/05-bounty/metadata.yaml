writing_rules:
  - 全篇第三人称限知
  - 不解释。小孩的腔调反转只写「骂街的腔调一下就收了」，不写「他这才意识到这是陷阱」
  - 不给任何人名字（主角是编号 R-31，猎人是物种，小孩是关系）
  - 不出现「她」「母亲」「说」（对话一律用直接引语，不加标签）
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 死亡必射、精液写足「一定五要」、死后有标志性仪式动作（脱靴＋按袜底编号）
  - 结尾不许有形容词

notes:
  - 至此五篇的等级色各占一档：G（01）／E（02）／O（03）／W（04）／**R（05）**——五档集齐。
  - **本篇是合集里第一个「门里的人死了」的走向**。前四篇门里那位始终是主体（忍、或忍无可忍）；
    本篇他成了货，而门外那个"熊孩子"的真相也终于落地：**他不是在骂人，他在报货。**
  - 与 01 的正反对照：01 门里的人**没出声**，活着；本篇门里的人**开了门**，死了。合集至此把"沉默"的两面都写完了。
  - 结尾那扇还开着的门，是合集的总装置——五篇里它第一次没有被谁关上。
