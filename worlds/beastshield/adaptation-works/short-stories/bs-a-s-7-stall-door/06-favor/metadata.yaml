preset_exception:
  target: 本合集写作铁律 6「结尾不解决问题，不给团圆」
  declared: 2026-09-15
  reason: |
    作者走向明确要求"他活下来了"——被店主与顾客从赏金猎人手里保下来，脱掉兽盾制服，成为店里的帮工。
    这必然给出一个"解决"，与铁律 6 相悖。按 ①③ preset §七 显式申报：
    **本篇是合集唯一一篇有团圆、有出路的**；它是有意为之的反面，用于把"沉默"的两面（死/活）都写齐。
    铁律 6 的其余部分仍然遵守：结尾不抒情、末句无形容词。
    另按作者指示，**结尾不留闭合感**：收在"第二天来了个穿黑制服的客人、他没被认出来"——
    他活着，编号还在兽盾的册子上，那条街也还在。**不给"从此过上了好日子"那种句号。**

origin:
  kind: 作者提供走向
  summary: |
    作者走向：处决过程中，店主出来阻止，说这人挺好的，要从赏金猎人手里保下来；
    其他顾客也附和"他人很好的"。最后他脱掉兽盾制服，成了店里的员工——店主收留了他，给了他一个去处；
    也可以说是赏金猎人网开一面。总之他活下来了。他很感谢那些替他求情的顾客，还有店主。
  adaptation_note: |
    落实取舍：
    1. **定位为 05《撸币》的另一走向**（同一个人、同一个早上、同一把刀），使死/活两面形成正反打。
    2. **店主的理由全部是动作，不是评价**：钱压在碗底多一分不少一分／支杆断了是他脱外套扶的，白制服糊了半袖子泥。
       顾客的附和也不是求情，全是作证：车蹭了娃是他背回去的／他抬过两袋面／他扫过门口的水。
    3. **猎人松手的理由**：他"记住这条街了"——不是被打动，是掂量。走前撂一句"那身白的，早点脱了"，
       这句话同时是威胁、是提醒、也是成全。
    4. **脱制服＝脱身份**：白制服被塞进灶膛，塑料扣子烧出呛味、火苗绿一下——兽盾的身份是烧得掉的，编号是留在袜子上的。
    5. **感谢只给一句**（「谢了。」），摊主回一句「少来这套」——合集不写煽情，恩情落在动作上（搬那筐碗、顾客给他腾道）。

