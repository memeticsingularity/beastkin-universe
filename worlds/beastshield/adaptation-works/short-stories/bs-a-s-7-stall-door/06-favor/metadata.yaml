      B2 精液一定五要**执行**（第一股的量/射向/质地/终态/环境互动全给）；B3 处决仪式链**执行**（制服→掏出→刺激→求饶→临界→射精→中止）；
      B5 情感调色盘（羞耻＋失控）；B7 爽点收尾；B8 断章；B9 五感齐备＋身体四件套＋事后层——全量执行。
      B4 死后仪式、B6 死法差异化**不适用**（无人死亡）。
