writing_rules:
  - 全篇第三人称限知
  - 不解释。店主的理由、顾客的附和**全都是具体动作，不是评价**；不写"他感动了"
  - 不给任何人名字
  - 不出现「她」「母亲」「说」（对话一律用直接引语，不加标签）
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 感谢只给一句，不许煽情；恩情落在动作上
  - 结尾不许有形容词
  - **本篇是申报过的例外**：允许给出"解决"与"出路"（违反合集铁律 6 的前半），其余铁律照守

notes:
  - **本篇与 05《撸币》是正反打**：同一个早上、同一个人、同一把刀。05 里那条街没出声（他死了）；本篇里那条街出了声（他活了）。
  - **这也是"沉默"主题的收口**：01 沉默＝资格／02 沉默＝没有话可说／03 沉默＝话已不需要他／04 不忍＝创伤／
    05 开门＝死／06 **整条街替他开口＝活**。合集走到这一篇，第一次让"沉默"被打破，而且是**被别人打破的**。
  - 「那身白的，早点脱了」是猎人留下的唯一善意，也是全篇最冷的一句成全。
