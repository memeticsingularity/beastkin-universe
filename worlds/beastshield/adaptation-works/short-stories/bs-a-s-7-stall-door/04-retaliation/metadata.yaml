writing_rules:
  - 全篇第三人称限知
  - 不解释。创伤只给动作与耳鸣，不写「他这才意识到」之类
  - 不给任何人名字（主角是编号 W-08，踹门者是物种）
  - 不出现「她」「母亲」「说」（对话一律用直接引语，不加标签）
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 死亡必射、精液写足「一定五要」、死后有标志性仪式动作
  - 结尾不许有形容词

notes:
  - 与前四篇共用同一个起点场景，但**机关换成了「不忍」**：
    01 恨错了对象／02 被爱错了对象／03 连「对象」都不存在／04 **他自己成了那个动手的对象**。
  - 本篇是全合集唯一的处决篇，也是①③ preset 的**有性版**示范：闸门 A 与闸门 B 全量执行。
  - 「右肩」是本篇唯一的抒情物：开头按一下、动手时疼一下、结尾再按一下——不解释它从哪来，只让它一直在。
