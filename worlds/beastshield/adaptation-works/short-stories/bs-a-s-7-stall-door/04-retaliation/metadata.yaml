origin:
  kind: 作者提供走向
  summary: 作者被"踹门骂街的熊孩子"恶心到，希望有一篇让这个人付出代价——门里的人不再隐忍（也许正好有这方面的 PTSD），开门把人拽进来、按进坑位，让他付出生命的代价。
  adaptation_note: |
    作者原话是「让这个小男孩付出代价」，同时交代「门外的不一定是小男孩，也是另外一个成年人」。
    **本篇取成年人**，理由有两层：
    1. ①③ 的闸门 B 要求肉体在场、制服／袜恋物、处决仪式等成人向呈现——这些**在未成年身上无法也不应成立**；
    2. 取成年人后，「熊孩子长大了的样子」反而更完整：一样踹门、一样骂街、一样不懂礼貌，
       只是这回有一具成年的、够壮的、能按 ① 处理的躯体。
    于是踹门者定为 **G级军绿制服的野猪兽人**（成年、壮硕、带酒气与哨绳），门里的人定为 **W级深蓝制服的棕熊兽人（摔跤手）**——
    刚好补上合集「待展开」的深蓝色，且摔跤手的身体最适合「拽进来、摁下去」这场戏。

