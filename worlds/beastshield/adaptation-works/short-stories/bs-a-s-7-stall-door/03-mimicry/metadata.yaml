      description: 精壮，肩膀宽，一张长脸，黑皮。制服裤裆部鼓着一团。**全篇零台词。** 他的职业就是每天把同样几句话喊出去。
      key_action: 听出来那是他自己的话

  alive_at_start:
    - name: 小孩
      species: 灰毛鹿兽人幼兽
      role: 街上住的孩子
      description: 个子才到大人的膝盖往上一点，两条腿细得跟筷子。**嘴里的话是跟着巷口那块屏学的，他不知道自己说的是什么。** 本篇是他第一次自己上厕所——他真的去了，也真的自己洗了手。
      key_action: 自己洗的手

    - name: 生父
      species: 灰毛鹿兽人
      role: 小孩的生父
      description: 手里拎着个袋子。看清那身蓝制服之后脸就白了，袋子往地上一扔。他说的每一句都不是解释，是求命：他不懂事／跟着屏学的／打过也不改／我本来要带他去的，他说他会上。手按在小孩肩膀上，指头一直在抖。
      key_action: 一把捂住小孩的嘴

  referenced_but_absent:
    - name: 来晚了的绿制服
      role: 主角的下级
      description: 今天早上在营区门口被主角用同一套话喊过。把帽子摘下来捏在手里，捏得帽檐都变形了。**全篇不命名——主角不知道他叫什么，也不打算知道。**

