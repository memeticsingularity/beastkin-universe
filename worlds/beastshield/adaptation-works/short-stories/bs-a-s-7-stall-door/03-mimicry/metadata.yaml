origin:
  kind: 作者补充的真实细节
  summary: 作者后来跟那小孩的家里人聊了几句。家里人说他那些脏话是看平板学的；本来家里人要带着他去上厕所，他自己说他会去——然后就闹了这么一出。
  note: |
    这条细节改写了整个合集第一个问题的答案（「那小孩为什么踹门」）。
    原先 01《隔间》给的处理是「小孩确实恨兽盾」（并让他撂下「你们这套衣服的，都他妈一个德行」）；
    02《擦肩》给的处理是「他就是个欠管教的熊孩子」。
    **作者提供的真相是第三种，也是最狠的一种：他不是在骂人，他是在放录音——而且是别人塞进他嘴里的录音。**
    本篇据此独立成篇，门里换成 O 级监工：那些话本来就是从他这种人嘴里出去的。
  constraint: 作者指示：在 03 存好配套并完成一次提交之前，01 与 02 一律不改。

characters:
  protagonist:
    - name: 杜宾兽人
      narrate_as: 杜宾兽人
