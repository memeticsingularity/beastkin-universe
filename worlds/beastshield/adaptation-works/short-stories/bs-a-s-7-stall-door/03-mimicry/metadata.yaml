writing_rules:
  - 全篇第三人称限知
  - **主角全篇零台词。** 唯一一次内心动作是「听出来那是他自己的话」
  - 不解释。不写「这说明」「他这才意识到」「心里一酸」
  - 不给任何人名字
  - 不出现「她」「母亲」「说」（对话一律用直接引语，不加标签）
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 生父的长篇交代**不许写成解释**，要写成求命：越快越乱越好
  - 结尾不许有形容词

notes:
  - 与前两篇共用同一个起点场景，但**机关又换了一次**：
    01 的小孩看见门缝下的靴尖 → 恨是冲着衣服来的；
    02 的小孩什么都没看见 → 他骂的是一扇门；
    03 的小孩**嘴里的话就是主角自己的话** → 主角连上火的对象都找不到。
  - 「他自己洗的手」是全场唯一的温柔，且没人接住它。生父在求命，主角在看那个动作——但看完就走了。
