world_mechanics:
  - 统御项圈（原作 Ch.5）：戴上后只能通过死亡或兽盾后台权限解除；遭外部冲击触发电流惩戒；冲击足以损毁时向脖颈注入致死量十倍浓缩药物
  - 兽盾制服等级制：G级军绿 / O级蓝 / R级白 / E级黑（金属护裆）/ W级深蓝
  - E级黑制服配**黑袜**（原作 Ch.5 原文）——非白袜，本合集按原作处理
  - 袜底编号：格式「等级字母-数字」，印在白袜袜底（见 settings/story-setting.md §4.1）

writing_rules:
  - 同一个起点，不许重复同一个答案；每一篇的沉默必须是不同的东西
  - 不解释。不写「这说明」「他这才意识到」「心里一酸」
  - 不给任何人名字
  - 不出现「她」「母亲」「说」
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
  - 结尾不解决问题，不给团圆；最后一句不许有形容词

