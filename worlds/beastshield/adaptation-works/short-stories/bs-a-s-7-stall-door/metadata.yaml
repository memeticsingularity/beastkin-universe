collection_info:
  type: 同源短篇合集 / Same-Origin Anthology
  premise: 同一个场景——早饭摊的厕所隔间，门外一个踹门的小孩，门里一个不出声的人——的不同走向。**门里那个人的制服颜色就是每一篇的全部变量。**
  structure: 单场切片，每篇独立成篇，篇内不分章；篇与篇之间不共享剧情，只共享场景与铁律
  variable_axis: 门里是谁（兽盾等级 / 是否戴项圈 / 手上有什么）
  language:
    - 中文 / Chinese

origin:
  kind: 作者提供的真实生活片段
  summary: 早饭摊吃早点，中途上卫生间；隔间外一个小孩边骂边踹门，隔间里的人一声不出；出来后回到座位，那小孩就好巧不巧坐在隔壁桌。
  supplement:
    date: 2026-09-14
    summary: 作者后来跟那小孩的家里人聊了几句。家里人说那些脏话是看平板学的；本来家里人要带着他去上厕所，他自己说他会去——然后就闹了这么一出。
    impact: |
      这条细节改写了合集开篇就挂着的那个问题（「那小孩为什么踹门」）。
      真相是：那小孩不是在骂人，他是在放录音——而且是别人塞进他嘴里的录音。
      而且那还是他第一次自己一个人去上厕所。
      03《学舌》据此独立成篇；01 与 02 的处理是作者提供此细节之前的版本，**按作者指示暂不改动**。
  note: 真实片段里小孩**不知道**门里是谁。各篇对这一点做不同处理——第 1 篇改成小孩看见门缝下的靴尖（知道是兽盾，不知是哪个）；第 2 篇保持小孩什么都不知道；第 3 篇反过来，门里的人听出来那是自己的话。

world_setting:
  name: 兽盾 / Beastshield
  location: 巷口早饭摊 · 后头的厕所
  time_period: 当代 / Contemporary · 清晨（夜班下班后）

preset:
  name: story-preset
  gates: "①③（③ 兽盾视觉／世界观 + ① 大狗口味）"
  mode: 无性版（Lv.0）
  declared: 2026-09-15
  declaration: |
    本合集按 ①③ preset §四「双版本协议」显式申报为「无性版」。
    - **闸门 A（③ 兽盾视觉／世界观）：全量执行**——物种白名单、制服色↔袜色配对、
      登场公式四项、体型铁律、双性征（乳部）、术语代称、全男、无流血、保鲜，逐条落实。
    - **闸门 B（① 大狗口味）**：B8 断章节奏、B9 感官在场（触觉主导／肉体在场／袜特写）全量执行；
      B1–B7（死亡必射／精液一定五要／处决仪式链／死后仪式／情感调色盘／死法差异化／处决式爽点收尾）
      在本合集的场景里**没有正面落点**——三篇的题目是「厕所隔间里的沉默」，场上没有死亡，
      强行植入处决会摧毁故事内核。故 B1–B7 转为**背景设定**（兽盾的死亡机制、主角的拖尸工作），不正面描写。
    - 依据：preset §四明文规定「场景不允许有性版时按无性版执行；③ 与 B8／B9 一条不省」。

