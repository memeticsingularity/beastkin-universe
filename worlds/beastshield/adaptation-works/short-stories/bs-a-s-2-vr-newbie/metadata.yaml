author_notes: |
  本作尝试一个全新的视角——VR玩家（降临者）第一次进入兽盾宇宙的经历。
  主角不是特工，不是赏金猎人，只是一个普通的程序员，以为自己在玩游戏。
  核心冲突不是"杀人"，而是"意识到这不是游戏"的认知冲击。
  故事聚焦于真实的生理反应（呕吐、恐惧）和一个普通人的成长起点。

