author_notes: |
  本作展示了兽盾世界观的另一面——不是赏金猎人的冷酷狩猎，而是特工局成员的"正义执行"。
  雷炎寰的挣扎在于他拥有强大力量（灼流暗劲），但还在学习控制。
  故事探讨了"正义"在这个世界的暧昧性：赏金猎人为了钱杀人，特工为了"正义"杀人——但死亡是一样的。

