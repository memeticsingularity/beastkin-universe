      description: 野生兽人，围捕时咬死过一名G级。血精石植入未成嗜精兽，力气畸形但精关失控。左耳缺一角，舌有旧切口（不会说话），右手小指缺一节。消瘦为长期营养不良的剧情设定。全篇零台词，靠动作。
