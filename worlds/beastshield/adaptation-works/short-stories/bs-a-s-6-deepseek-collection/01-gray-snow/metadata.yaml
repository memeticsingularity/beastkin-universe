writing_rules:
  - 叙述代词全篇用「他」，一次不许滑向「它」
  - 兽盾公文/口令用「它」「料」；石的口语从「它」不自觉滑向「他」
  - 命名层：不出现"我给你起个名字"，只出现"认出来"
  - 不写羁绊解释，只写动作
  - 不越狱、不康复、不团圆；被咬死的G级不被原谅
  - 场景 03/04/05 为「第一次」场，慢写，不许压缩
  - 兽盾兵形体描写禁止「精瘦/瘦小/纤细」
